# Build the site and deploy dist/ to Cloudflare Pages (project "orbits") on every push to main.
# Needs one repository secret, CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). The account ID is not secret.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build.py
        env:
          SITE_URL: https://sectus.dev/
      # Creates the Pages project on the first run; fails harmlessly once it exists.
      - uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 68d8d1208738455968f33253baea3ed9
          command: pages project create orbits --production-branch=main
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 68d8d1208738455968f33253baea3ed9
          command: pages deploy dist --project-name=orbits --branch=main
